name: 5DR Assessment Refresh Proxy
run-name: 5DR Assessment Refresh · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Governed EDGE Console request ID requiring fresh assessment state
        required: true
        type: string
      console_url:
        description: EDGE Console base URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 5dr-assessment-refresh-proxy
  cancel-in-progress: false

env:
  FIVEDR_HANDOFF_URL: https://raw.githubusercontent.com/kanirudhsaxena-code/5DR-V2/state/assessment-handoff/runtime/5dr-assessment-handoff.json
  FIVEDR_HANDOFF_MAX_AGE_SECONDS: '7200'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch authoritative 5DR assessment state
        run: |
          set -euo pipefail
          curl --location --fail-with-body --silent --show-error             -H "Accept: application/json"             -H "Cache-Control: no-cache"             "${FIVEDR_HANDOFF_URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             -o assessment-handoff.json
          test -s assessment-handoff.json

      - name: Validate authoritative assessment contract
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          data=json.load(open('assessment-handoff.json',encoding='utf-8'))
          assert data.get('schema_version')=='5DR_ASSESSMENT_HANDOFF_V1', data
          generated=str(data.get('generated_at') or '')
          generated_at=datetime.fromisoformat(generated.replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-generated_at).total_seconds()
          max_age=float(os.environ['FIVEDR_HANDOFF_MAX_AGE_SECONDS'])
          assert -300 <= age <= max_age, {
              'generated_at':generated,
              'age_seconds':age,
              'max_age_seconds':max_age,
              'blocker':'AUTHORITATIVE_5DR_HANDOFF_STALE',
          }

          assessment=data.get('assessment') or {}
          assert assessment.get('engine')=='5DR', assessment
          assert assessment.get('forecast_id'), assessment
          assert assessment.get('assessed_at'), assessment
          metrics=assessment.get('metrics') or {}
          assert metrics.get('assessment_snapshot_complete') is True, metrics
          assert metrics.get('recommendation_ledger_complete') is True, metrics
          day=metrics.get('day_metrics') or {}
          assert all(label in day for label in ('D','D+1','D+2','D+3','D+4')), day
          ledger=metrics.get('recommendation_ledger')
          assert isinstance(ledger,list), metrics
          assert len(ledger)==int(metrics.get('all_recommendations_count',-1)), metrics

          json.dump(assessment,open('assessment-import.json','w',encoding='utf-8'),separators=(',',':'))
          print('ASSESSMENT_REFRESH_PROXY_CONTRACT=PASS')
          print(f'ASSESSMENT_HANDOFF_AGE_SECONDS={age:.0f}')
          PY

      - name: Import fresh assessment into governed Console state
        env:
          CONSOLE_URL: ${{ inputs.console_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ENDPOINT="$CONSOLE_URL/api/5dr/assessment-import"
          post_auth() {
            curl --location --fail-with-body --silent --show-error               -X POST               -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"               -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"               -H "Content-Type: application/json"               --data-binary @assessment-import.json "$ENDPOINT"
          }
          post_public() {
            curl --location --fail-with-body --silent --show-error               -X POST -H "Content-Type: application/json"               --data-binary @assessment-import.json "$ENDPOINT"
          }
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            post_auth || post_public
          else
            post_public
          fi
          echo "ASSESSMENT_REFRESH_PROXY_IMPORT=PASS"

      - name: Upload bounded refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: 5dr-assessment-refresh-${{ inputs.request_id }}
          path: |
            assessment-handoff.json
            assessment-import.json
          retention-days: 30
          if-no-files-found: error
