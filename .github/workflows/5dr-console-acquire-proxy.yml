name: 5DR Console Acquire Proxy
run-name: 5DR Automated Evidence · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Governed EDGE Console request ID
        required: true
        type: string
      console_url:
        description: EDGE Console base URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 5dr-console-acquire-proxy-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  FIVEDR_REF: 0220a39708b36174dbe806bd5781072968466466

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout pinned canonical 5DR engine
        run: |
          git init fivedr
          git -C fivedr remote add origin https://github.com/kanirudhsaxena-code/5DR-V2.git
          git -C fivedr fetch --depth 1 origin "$FIVEDR_REF"
          git -C fivedr checkout --detach FETCH_HEAD
          test "$(git -C fivedr rev-parse HEAD)" = "$FIVEDR_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guarded cache database driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'

      - name: Validate acquisition bridge
        working-directory: fivedr
        run: python -m unittest tests.test_console_automated_evidence -v

      - name: Acquire bounded automated market evidence
        working-directory: fivedr
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIVE_DR_HISTORICAL_CACHE_MODE: CACHE_FIRST
        run: >-
          python -m experiments.console_automated_evidence
          --request-id "${{ inputs.request_id }}"
          --output console_market_evidence.json

      - name: Emit bounded evidence handoff
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          raw=Path("fivedr/console_market_evidence.json").read_bytes()
          print("EDGE_CONSOLE_MARKET_EVIDENCE_B64::"+base64.b64encode(raw).decode("ascii"))
          PY

      - name: Publish bounded evidence to EDGE Console
        continue-on-error: true
        env:
          CONSOLE_URL: ${{ inputs.console_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ENDPOINT="$CONSOLE_URL/api/5dr/run-requests/$REQUEST_ID/automated-market-evidence"
          post_auth() {
            curl --location --fail-with-body --silent --show-error               -X POST               -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"               -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"               -H "Content-Type: application/json"               --data-binary @fivedr/console_market_evidence.json               "$ENDPOINT"
          }
          post_public() {
            curl --location --fail-with-body --silent --show-error               -X POST               -H "Content-Type: application/json"               --data-binary @fivedr/console_market_evidence.json               "$ENDPOINT"
          }
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            post_auth || post_public
          else
            post_public
          fi

      - name: Upload bounded acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5dr-console-market-evidence-${{ inputs.request_id }}
          path: fivedr/console_market_evidence.json
          retention-days: 30
          if-no-files-found: error
