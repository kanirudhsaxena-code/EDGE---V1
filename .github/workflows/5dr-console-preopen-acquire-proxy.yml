name: 5DR Console Pre-open Acquire Proxy
run-name: 5DR Pre-open Evidence · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Governed EDGE Console request ID
        required: true
        type: string
      console_url:
        description: EDGE Console base URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 5dr-console-preopen-acquire-proxy-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  FIVEDR_REF: 74aa9ecdd107e4b0142e8208e42db78ed6b11de6

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout pinned canonical 5DR engine
        run: |
          git init fivedr
          git -C fivedr remote add origin https://github.com/kanirudhsaxena-code/5DR-V2.git
          git -C fivedr fetch --depth 1 origin "$FIVEDR_REF"
          git -C fivedr checkout --detach FETCH_HEAD
          test "$(git -C fivedr rev-parse HEAD)" = "$FIVEDR_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dedicated PREOPEN bridge
        working-directory: fivedr
        run: python -m unittest tests.test_console_preopen_evidence -v

      - name: Acquire bounded PREOPEN market evidence
        working-directory: fivedr
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: >-
          python -m experiments.console_preopen_evidence
          --request-id "${{ inputs.request_id }}"
          --output console_preopen_market_evidence.json

      - name: Emit bounded evidence handoff
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          raw=Path("fivedr/console_preopen_market_evidence.json").read_bytes()
          print("EDGE_CONSOLE_MARKET_EVIDENCE_B64::"+base64.b64encode(raw).decode("ascii"))
          PY

      - name: Upload bounded PREOPEN artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5dr-console-preopen-market-evidence-${{ inputs.request_id }}
          path: fivedr/console_preopen_market_evidence.json
          retention-days: 30
          if-no-files-found: error

      # Callback is a fast-path only. The governed Console recovery path can
      # pull the immutable evidence marker from this successful workflow, so
      # Access/transport failure must never strand otherwise valid PREOPEN data.
      - name: Publish bounded PREOPEN evidence to EDGE Console
        continue-on-error: true
        env:
          CONSOLE_URL: ${{ inputs.console_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ENDPOINT="$CONSOLE_URL/api/5dr/run-requests/$REQUEST_ID/automated-market-evidence"
          post_auth() {
            curl --location --fail-with-body --silent --show-error \
              -X POST \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @fivedr/console_preopen_market_evidence.json \
              "$ENDPOINT"
          }
          post_public() {
            curl --location --fail-with-body --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @fivedr/console_preopen_market_evidence.json \
              "$ENDPOINT"
          }
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            post_auth || post_public
          else
            post_public
          fi
