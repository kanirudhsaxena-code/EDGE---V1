name: EDGE Autonomous Learning Cycle

on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run governed Learning Lab cycle
        run: |
          set -o pipefail
          python -m src.learning_cycle_cli | tee edge-learning-cycle.json
      - name: Upload cycle audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-learning-cycle
          path: edge-learning-cycle.json
          retention-days: 30
