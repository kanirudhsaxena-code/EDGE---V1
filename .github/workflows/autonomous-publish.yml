name: EDGE Autonomous Publish
# manual governed autonomous publishing

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE trading symbol"
        required: true
        default: "LTF"
      holding_state:
        description: "UNKNOWN, HOLDS, or NO_HOLDING"
        required: true
        default: "UNKNOWN"
      research_bundle_id:
        description: "Immutable governed EDGE research bundle id"
        required: true
      lifecycle_id:
        description: "Optional governed EDGE lifecycle id; mandatory for new data-first orchestration"
        required: false
      market_snapshot_id:
        description: "Optional immutable DATA snapshot id paired with lifecycle_id"
        required: false
      canonical_requested_at:
        description: "Optional governed pre-open canonical request timestamp (ISO-8601)"
        required: false
      canonical_attempt_slot:
        description: "Optional pre-open attempt slot label"
        required: false

permissions:
  contents: read

concurrency:
  group: edge-autonomous-publish-${{ inputs.ticker || 'LTF' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      EDGE_TICKER: ${{ inputs.ticker || 'LTF' }}
      EDGE_HOLDING_STATE: ${{ inputs.holding_state || 'UNKNOWN' }}
      EDGE_RUN_MODE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
      EDGE_RESEARCH_BUNDLE_ID: ${{ inputs.research_bundle_id || '' }}
      EDGE_LIFECYCLE_ID: ${{ inputs.lifecycle_id || '' }}
      EDGE_MARKET_SNAPSHOT_ID: ${{ inputs.market_snapshot_id || '' }}
      EDGE_CANONICAL_REQUESTED_AT: ${{ inputs.canonical_requested_at || '' }}
      EDGE_CANONICAL_ATTEMPT_SLOT: ${{ inputs.canonical_attempt_slot || '' }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify required G5 forecast-path schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          import psycopg

          required_tables={
              'edge_stock_forecast_paths',
              'edge_stock_forecast_path_rows',
          }
          required_float_columns={
              'bull_probability',
              'base_probability',
              'bear_probability',
              'expected_centre',
              'outer_expected_zone_low',
              'outer_expected_zone_high',
          }
          conn=psycopg.connect(os.environ['DATABASE_URL'])
          try:
              cur=conn.cursor()
              cur.execute(
                  """
                  select c.relname
                  from pg_class c
                  join pg_namespace n on n.oid=c.relnamespace
                  where n.nspname=current_schema()
                    and c.relname = any(%s)
                    and c.relkind='r'
                  """,
                  (list(required_tables),),
              )
              found={str(row[0]) for row in cur.fetchall()}
              cur.execute(
                  """
                  select column_name,data_type
                  from information_schema.columns
                  where table_schema=current_schema()
                    and table_name='edge_stock_forecast_path_rows'
                    and column_name = any(%s)
                  """,
                  (list(required_float_columns),),
              )
              found_types={str(name):str(dtype) for name,dtype in cur.fetchall()}
              schema_ready=(
                  found == required_tables
                  and set(found_types) == required_float_columns
                  and all(dtype=='double precision' for dtype in found_types.values())
              )
              if not schema_ready:
                  print(json.dumps({
                      'status':'BLOCKED_CONFIGURATION',
                      'diagnostic_code':'G5_SCHEMA_NOT_READY',
                      'required_tables':sorted(required_tables),
                      'found_tables':sorted(found),
                      'required_float_columns':sorted(required_float_columns),
                      'found_float_types':found_types,
                      'publishing_enabled':False,
                      'trading_enabled':False,
                  },sort_keys=True))
                  sys.exit(4)
              print(json.dumps({
                  'G5_SCHEMA_READINESS':'PASS',
                  'tables':sorted(found),
                  'float_storage_types':found_types,
              },sort_keys=True))
          finally:
              conn.close()
          PY
      - name: Run governed autonomous publisher
        run: |
          set -o pipefail
          python -m src.autonomous_publish_cli | tee edge-autonomous-publish.json
      - name: Upload bounded publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-autonomous-publish
          path: |
            edge-autonomous-publish.json
            edge-published-report.md
          if-no-files-found: ignore
          retention-days: 7
