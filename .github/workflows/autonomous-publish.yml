name: EDGE Autonomous Publish
# manual governed autonomous publishing

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE trading symbol"
        required: true
        default: "LTF"
      holding_state:
        description: "UNKNOWN, HOLDS, or NO_HOLDING"
        required: true
        default: "UNKNOWN"
      research_bundle_id:
        description: "Immutable EDGE_RESEARCH_BUNDLE_V1 id created by ChatGPT research orchestration"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      EDGE_TICKER: ${{ inputs.ticker || 'LTF' }}
      EDGE_HOLDING_STATE: ${{ inputs.holding_state || 'UNKNOWN' }}
      EDGE_RUN_MODE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
      EDGE_RESEARCH_BUNDLE_ID: ${{ inputs.research_bundle_id || '' }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run governed autonomous publisher
        run: |
          set -o pipefail
          python -m src.autonomous_publish_cli | tee edge-autonomous-publish.json
      - name: Upload bounded publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-autonomous-publish
          path: |
            edge-autonomous-publish.json
            edge-published-report.md
          if-no-files-found: ignore
          retention-days: 7
