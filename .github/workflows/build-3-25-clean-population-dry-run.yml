name: Build 3.25 EDGE Stocks Clean Population Dry Run

on:
  push:
    branches: [build-3.25-data-integrity-20261008]
    paths:
      - 'migrations/013_build_3_25_clean_efficacy_population.sql'
      - '.github/workflows/build-3-25-clean-population-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL 17 client
        run: docker pull postgres:17
      - name: Apply migration inside rollback-only transaction
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          {
            echo 'begin;'
            cat migrations/013_build_3_25_clean_efficacy_population.sql
            echo "\\copy (select total_recommendations,selected_benchmark_count,official_scorable_count,provisional_open_count,repair_pending_count,audit_incomplete_count,all_run_diagnostic_count,nonofficial_other_count,coalesce(official_resolved_coverage_pct::text,''),selected_complete_path_count,selected_audit_exclusion_count,coalesce(selected_path_completeness_pct::text,'') from v_build_3_25_edge_stock_population_summary) to stdout with csv"
            echo 'rollback;'
          } | docker run -i --rm postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 > /tmp/tx.log
          grep -E '^[0-9]+,' /tmp/tx.log | tail -1 > /tmp/summary.csv
          cat /tmp/summary.csv
      - name: Validate expected population
        run: |
          python - <<'PY'
          line=open('/tmp/summary.csv').read().strip().split(',')
          assert len(line)==12,line
          total,selected,official,provisional,repair,audit,allrun,other,coverage,complete_path,selected_audit,path_pct=line
          total,selected,official,provisional,repair,audit,allrun,other=map(int,(total,selected,official,provisional,repair,audit,allrun,other))
          # No hard-coded production row counts: fail on omissions and classification drift.
          assert min(total,selected,official,provisional,repair,audit,allrun,other)>=0,line
          assert total == official+provisional+repair+audit+allrun+other,line
          complete_path,selected_audit=int(complete_path),int(selected_audit)
          assert selected<=total and selected == official+provisional+repair+selected_audit,line
          assert 0 <= complete_path <= selected,line
          assert 0 <= selected_audit <= audit,line
          path_expected=(100.0*complete_path/selected) if selected else None
          assert (path_pct=='' and path_expected is None) or (path_expected is not None and abs(float(path_pct)-path_expected)<0.02),line
          expected=(100.0*official/(official+repair)) if official+repair else None
          assert (coverage=='' and expected is None) or (expected is not None and abs(float(coverage)-expected)<0.02),line
          print('total',total,'selected',selected,'official',official,'provisional',provisional,'repair',repair,'audit',audit,'allrun',allrun,'other',other)
          print('BUILD_3_25_EDGE_STOCKS_CLEAN_POPULATION_DRY_RUN=PASS')
          PY
