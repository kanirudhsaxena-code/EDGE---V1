name: Dispatch G3 EDGE Learning Lab Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-g3-learning-lab-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production EDGE Learning Lab workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autonomous-learning-cycle.yml --repo "${{ github.repository }}" --ref main
