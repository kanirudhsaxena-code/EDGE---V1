name: Select Corrected 24 Sep LTF Exception Canonical

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exception-canonical-corrected-ltf-20260924.yml'

permissions:
  contents: read

jobs:
  override:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Replace stale-price LTF canonical with corrected live-price run
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg

          bundle_id='EDGE-RESEARCH-LTF-20260924-DEEP-100415IST'
          expected_run_id='EDGE-LTF-20260924-043427-AUTO'
          superseded_run_id='EDGE-LTF-20260924-040757-AUTO'
          target_date='2026-09-24'
          expected_reference_price=289.30
          IST=ZoneInfo('Asia/Kolkata')
          now=datetime.now(IST)
          reason=(
            'CORRECTED user-authorized EXCEPTION_CANONICAL for 2026-09-24. This supersedes '
            f'{superseded_run_id}, whose displayed current/reference price inherited the prior completed daily close '
            'of Rs 310 rather than the fresh authenticated intraday quote. The corrected run '
            f'{expected_run_id} was requested at approximately 10:04 IST with fresh governed deep research and '
            'the authenticated Upstox NSE LTF instrument NSE_EQ|INE498L01015 (ISIN INE498L01015). Its frozen '
            f'run reference price is Rs {expected_reference_price:.2f}; a separate authenticated diagnostic at '
            '10:06 IST showed Rs 288.40 with session range Rs 279.00-Rs 290.60 and prior close Rs 310.00, '
            'consistent with normal intraday movement after the frozen run timestamp. Actual timestamps are preserved.'
          )

          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
            with conn.cursor() as cur:
              cur.execute('''
                SELECT r.recommendation_id,r.ticker,r.forecast_horizon,r.run_timestamp,r.created_at,
                       rp.reference_price, erb.research_fresh_at
                  FROM recommendations r
                  JOIN recommendation_performance rp USING(recommendation_id)
                  JOIN recommendation_research_bundle rrb USING(recommendation_id)
                  JOIN edge_research_bundles erb USING(bundle_id)
                 WHERE upper(r.ticker)='LTF' AND rrb.bundle_id=%s
                 ORDER BY r.created_at DESC
                 LIMIT 1
              ''',(bundle_id,))
              row=cur.fetchone()
              if not row:
                raise SystemExit('LTF_CORRECTED_RECOMMENDATION_NOT_FOUND')
              rec_id,ticker,horizon,run_at,completed_at,reference_price,research_fresh_at=row
              if rec_id != expected_run_id:
                raise SystemExit(f'LTF_CORRECTED_RUN_ID_MISMATCH got={rec_id} expected={expected_run_id}')
              if reference_price is None or abs(float(reference_price)-expected_reference_price)>0.05:
                raise SystemExit(f'LTF_CORRECTED_REFERENCE_PRICE_MISMATCH got={reference_price} expected={expected_reference_price}')
              key=f'LTF|{target_date}|{str(horizon).upper()}'
              print(f'corrected_recommendation_id={rec_id} canonical_key={key} reference_price={reference_price}')

              cur.execute('''
                INSERT INTO edge_recommendation_governance(
                  recommendation_id,canonical_key,ticker,target_trading_date,forecast_horizon,
                  candidate_type,requested_at,completed_at,ordinary_cutoff_at,hard_boundary_at,
                  research_fresh_at,fallback_reason
                ) VALUES (%s,%s,'LTF',%s,%s,'EXCEPTION_CANONICAL',%s,%s,
                          %s::date + time '08:55:59',%s::date + time '09:00:00',%s,%s)
                ON CONFLICT (recommendation_id) DO UPDATE SET
                  canonical_key=EXCLUDED.canonical_key,
                  ticker=EXCLUDED.ticker,
                  target_trading_date=EXCLUDED.target_trading_date,
                  forecast_horizon=EXCLUDED.forecast_horizon,
                  candidate_type='EXCEPTION_CANONICAL',
                  research_fresh_at=EXCLUDED.research_fresh_at,
                  fallback_reason=EXCLUDED.fallback_reason
              ''',(rec_id,key,target_date,horizon,run_at,completed_at or run_at,target_date,target_date,research_fresh_at,reason))

              cur.execute('''
                INSERT INTO edge_canonical_selections(
                  canonical_key,ticker,target_trading_date,forecast_horizon,
                  selection_status,canonical_type,selected_recommendation_id,selected_at,selection_reason
                ) VALUES (%s,'LTF',%s,%s,'SELECTED','EXCEPTION_CANONICAL',%s,%s,%s)
                ON CONFLICT (canonical_key) DO UPDATE SET
                  ticker=EXCLUDED.ticker,
                  target_trading_date=EXCLUDED.target_trading_date,
                  forecast_horizon=EXCLUDED.forecast_horizon,
                  selection_status='SELECTED',
                  canonical_type='EXCEPTION_CANONICAL',
                  selected_recommendation_id=EXCLUDED.selected_recommendation_id,
                  selected_at=EXCLUDED.selected_at,
                  selection_reason=EXCLUDED.selection_reason
              ''',(key,target_date,horizon,rec_id,now,reason))

              cur.execute('''
                UPDATE recommendation_lifecycle l
                   SET include_in_master_metrics=false,updated_at=now()
                 WHERE l.recommendation_id IN (
                   SELECT g.recommendation_id FROM edge_recommendation_governance g
                    WHERE g.ticker='LTF' AND g.target_trading_date=%s AND g.forecast_horizon=%s
                 )
              ''',(target_date,horizon))
              cur.execute('''
                UPDATE recommendation_lifecycle
                   SET include_in_master_metrics=true,updated_at=now()
                 WHERE recommendation_id=%s
              ''',(rec_id,))

              cur.execute('''
                SELECT s.selection_status,s.canonical_type,s.selected_recommendation_id,
                       l.include_in_master_metrics,g.candidate_type,rp.reference_price
                  FROM edge_canonical_selections s
                  JOIN recommendation_lifecycle l ON l.recommendation_id=s.selected_recommendation_id
                  JOIN edge_recommendation_governance g ON g.recommendation_id=s.selected_recommendation_id
                  JOIN recommendation_performance rp ON rp.recommendation_id=s.selected_recommendation_id
                 WHERE s.canonical_key=%s
              ''',(key,))
              verified=cur.fetchone()
              if not verified or verified[0]!='SELECTED' or verified[1]!='EXCEPTION_CANONICAL' or verified[2]!=rec_id or verified[3] is not True or verified[4]!='EXCEPTION_CANONICAL':
                raise SystemExit(f'LTF_CORRECTED_CANONICAL_VERIFY_FAILED {verified}')

              cur.execute('SELECT include_in_master_metrics FROM recommendation_lifecycle WHERE recommendation_id=%s',(superseded_run_id,))
              old=cur.fetchone()
              old_master=old[0] if old else None
              if old_master is True:
                raise SystemExit('LTF_SUPERSEDED_RUN_STILL_IN_MASTER_METRICS')

              out={
                'status':'LTF_CORRECTED_EXCEPTION_CANONICAL_CONFIRMED',
                'target_trading_date':target_date,
                'canonical_key':key,
                'recommendation_id':rec_id,
                'run_id':expected_run_id,
                'superseded_run_id':superseded_run_id,
                'research_bundle_id':bundle_id,
                'reference_price':float(verified[5]),
                'canonical_type':verified[1],
                'include_in_master_metrics':verified[3],
                'superseded_include_in_master_metrics':old_master,
                'selected_at':now.isoformat(),
              }
              print(json.dumps(out,sort_keys=True))
              open('ltf-corrected-canonical-confirmation.json','w').write(json.dumps(out,indent=2,sort_keys=True))
            conn.commit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltf-corrected-canonical-confirmation-20260924
          path: ltf-corrected-canonical-confirmation.json
          if-no-files-found: ignore
          retention-days: 30
