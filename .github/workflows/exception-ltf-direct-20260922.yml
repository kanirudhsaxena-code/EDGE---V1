name: One-time 22 Sep LTF Direct Exception Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exception-ltf-direct-20260922.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      EDGE_TICKER: LTF
      EDGE_HOLDING_STATE: UNKNOWN
      EDGE_RUN_MODE: MANUAL
      EDGE_RESEARCH_BUNDLE_ID: EDGE-RESEARCH-LTF-20260922T040104Z
      EDGE_CANONICAL_REQUESTED_AT: ''
      EDGE_CANONICAL_ATTEMPT_SLOT: ''
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run governed autonomous publisher
        run: |
          set -o pipefail
          python -m src.autonomous_publish_cli | tee edge-autonomous-publish.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exception-ltf-direct-20260922
          path: |
            edge-autonomous-publish.json
            edge-published-report.md
          if-no-files-found: ignore
          retention-days: 30
