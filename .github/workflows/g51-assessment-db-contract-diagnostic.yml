name: G5.1 Assessment DB Contract Diagnostic
on:
  push:
    branches: [g51-assessment-db-diagnostic-20261004]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Check non-secret relation availability
        run: |
          python - <<'PY'
          import os, json, psycopg
          conn=psycopg.connect(os.environ['DATABASE_URL'])
          try:
            with conn.cursor() as cur:
              cur.execute("""select
                current_database(),
                current_schema(),
                to_regclass('public.canonical_selections') is not null,
                to_regclass('public.forecasts') is not null,
                to_regclass('public.outcome_checkpoints') is not null,
                to_regclass('public.edge_stock_forecast_paths') is not null,
                to_regclass('public.recommendations') is not null
              """)
              db,schema,canon,forecasts,checkpoints,edge_paths,recs=cur.fetchone()
              print(json.dumps({
                "database":db,"schema":schema,
                "has_5dr_canonical_selections":canon,
                "has_5dr_forecasts":forecasts,
                "has_5dr_outcome_checkpoints":checkpoints,
                "has_edge_stock_forecast_paths":edge_paths,
                "has_recommendations":recs
              },sort_keys=True))
          finally:
            conn.close()
          PY
