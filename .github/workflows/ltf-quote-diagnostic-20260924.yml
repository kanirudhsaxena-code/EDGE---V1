name: One-time NIFTY + LTF Quote Diagnostic 24 Sep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltf-quote-diagnostic-20260924.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - name: Inspect authenticated NIFTY and LTF live state
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          token=os.environ['UPSTOX_ANALYTICS_TOKEN']
          base='https://api.upstox.com'
          def get(path, params=None):
              url=base+path
              if params: url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Accept':'application/json','Authorization':'Bearer '+token,'User-Agent':'EDGE-Market-Diagnostic/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read())
          print('DIAGNOSTIC_IST='+datetime.now(ZoneInfo('Asia/Kolkata')).isoformat())

          search=get('/v2/instruments/search',{'query':'LTF','exchanges':'NSE','segments':'EQ','page_number':'1','records':'30'})
          rows=search.get('data') or []
          exact=[r for r in rows if str(r.get('trading_symbol','')).upper()=='LTF' and r.get('segment')=='NSE_EQ' and r.get('instrument_type')=='EQ']
          clean=[{k:r.get(k) for k in ['trading_symbol','name','instrument_key','exchange_token','isin','segment','instrument_type']} for r in exact]
          print('LTF_EXACT_MATCHES='+json.dumps(clean,sort_keys=True))
          if len(exact)!=1: raise SystemExit('Expected exactly one LTF NSE_EQ match')
          ltf_key=exact[0]['instrument_key']
          ltf_quote=get('/v3/market-quote/quotes',{'instrument_key':ltf_key})
          print('LTF_QUOTE_DATA='+json.dumps(ltf_quote.get('data'),sort_keys=True))
          ltf_intraday=get('/v3/historical-candle/intraday/'+urllib.parse.quote(ltf_key,safe='')+'/minutes/1')
          ltf_candles=((ltf_intraday.get('data') or {}).get('candles') or [])
          print('LTF_INTRADAY_FIRST10='+json.dumps(ltf_candles[:10],sort_keys=True))
          print('LTF_INTRADAY_LAST10='+json.dumps(ltf_candles[-10:],sort_keys=True))

          # LTF nearest option expiry and live chain, bounded around spot
          contracts=get('/v2/option/contract',{'instrument_key':ltf_key})
          crows=contracts.get('data') or []
          expiries=sorted({str(r.get('expiry'))[:10] for r in crows if isinstance(r,dict) and r.get('expiry') and str(r.get('expiry'))[:10] >= str(date.today())})
          if expiries:
              expiry=expiries[0]
              chain=get('/v2/option/chain',{'instrument_key':ltf_key,'expiry_date':expiry})
              chainrows=chain.get('data') or []
              spot=list((ltf_quote.get('data') or {}).values())[0].get('last_price')
              bounded=[]
              for r in chainrows:
                  if not isinstance(r,dict): continue
                  strike=float(r.get('strike_price') or 0)
                  if spot and abs(strike-float(spot)) <= 35:
                      ce=r.get('call_options') or {}; pe=r.get('put_options') or {}
                      bounded.append({'strike':strike,'CE':ce,'PE':pe})
              print('LTF_OPTION_EXPIRY='+expiry)
              print('LTF_OPTION_CHAIN_BOUNDED='+json.dumps(bounded,sort_keys=True))
          else:
              print('LTF_OPTION_EXPIRY=NONE')

          nifty_key='NSE_INDEX|Nifty 50'
          nifty_quote=get('/v3/market-quote/quotes',{'instrument_key':nifty_key})
          print('NIFTY_QUOTE_DATA='+json.dumps(nifty_quote.get('data'),sort_keys=True))
          nifty_intraday=get('/v3/historical-candle/intraday/'+urllib.parse.quote(nifty_key,safe='')+'/minutes/1')
          nifty_candles=((nifty_intraday.get('data') or {}).get('candles') or [])
          print('NIFTY_INTRADAY_FIRST10='+json.dumps(nifty_candles[:10],sort_keys=True))
          print('NIFTY_INTRADAY_LAST10='+json.dumps(nifty_candles[-10:],sort_keys=True))
          PY
