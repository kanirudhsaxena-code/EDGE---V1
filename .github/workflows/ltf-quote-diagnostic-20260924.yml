name: One-time LTF Quote Diagnostic 24 Sep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltf-quote-diagnostic-20260924.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - name: Resolve LTF and inspect authenticated quote
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ['UPSTOX_ANALYTICS_TOKEN']
          base='https://api.upstox.com'
          def get(path, params=None):
              url=base+path
              if params: url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Accept':'application/json','Authorization':'Bearer '+token,'User-Agent':'EDGE-LTF-Diagnostic/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read())
          search=get('/v2/instruments/search',{'query':'LTF','exchanges':'NSE','segments':'EQ','page_number':'1','records':'30'})
          rows=search.get('data') or []
          exact=[r for r in rows if str(r.get('trading_symbol','')).upper()=='LTF' and r.get('segment')=='NSE_EQ' and r.get('instrument_type')=='EQ']
          clean=[]
          for r in exact:
              clean.append({k:r.get(k) for k in ['trading_symbol','name','instrument_key','exchange_token','isin','segment','instrument_type']})
          print('EXACT_MATCHES='+json.dumps(clean,sort_keys=True))
          if len(exact)!=1: raise SystemExit('Expected exactly one LTF NSE_EQ match')
          key=exact[0]['instrument_key']
          quote=get('/v3/market-quote/quotes',{'instrument_key':key})
          print('QUOTE_DATA='+json.dumps(quote.get('data'),sort_keys=True))
          intraday=get('/v3/historical-candle/intraday/'+urllib.parse.quote(key,safe='')+'/minutes/1')
          candles=((intraday.get('data') or {}).get('candles') or [])
          print('INTRADAY_FIRST5='+json.dumps(candles[:5],sort_keys=True))
          print('INTRADAY_LAST5='+json.dumps(candles[-5:],sort_keys=True))
          PY
