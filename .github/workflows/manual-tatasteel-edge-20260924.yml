name: Manual TATASTEEL EDGE 25 Sep 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-tatasteel-edge-20260924.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      EDGE_TICKER: TATASTEEL
      EDGE_HOLDING_STATE: UNKNOWN
      EDGE_RUN_MODE: MANUAL
      EDGE_RESEARCH_BUNDLE_ID: EDGE-RESEARCH-TATASTEEL-20260925-DEEP-1059IST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Insert immutable ChatGPT research bundle
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          import psycopg

          fresh=datetime.now(timezone.utc)
          fresh_iso=fresh.isoformat()
          bundle_id=os.environ['EDGE_RESEARCH_BUNDLE_ID']
          payload={
            'contract_version':'EDGE_RESEARCH_BUNDLE_V1',
            'research_authority':'CHATGPT',
            'ticker':'TATASTEEL',
            'research_fresh_at':fresh_iso,
            'retrieval_providers':['CHATGPT_WEB'],
            'sources':[
              {'source_id':'S1','provider':'CHATGPT_WEB','url':'https://upstox.com/stocks/tata-steel-limited-share-price/','title':'Upstox Tata Steel share price, financials and ownership'},
              {'source_id':'S2','provider':'CHATGPT_WEB','url':'https://www.financialexpress.com/market/stock-insights/india-is-outpacing-china-in-steel-growth-3-stocks-to-watch-in-the-boom/4344103/','title':'Financial Express: India outpacing China in steel growth'},
              {'source_id':'S3','provider':'CHATGPT_WEB','url':'https://www.reuters.com/business/energy/eu-impose-provisional-safeguards-protect-electrical-steel-imports-2026-09-18/','title':'Reuters: EU electrical steel safeguards effective Sep 25'},
              {'source_id':'S4','provider':'CHATGPT_WEB','url':'https://www.reuters.com/commentary/breakingviews/markets-are-slow-grasp-depths-tata-mess-2026-09-18/','title':'Reuters Breakingviews: Tata Group governance uncertainty'},
              {'source_id':'S5','provider':'CHATGPT_WEB','url':'https://scanx.trade/stock-market-news/companies/tata-steel-schedules-hong-kong-investor-meet-september-25/51199888','title':'Tata Steel Hong Kong investor meeting Sep 25'},
              {'source_id':'S6','provider':'CHATGPT_WEB','url':'https://hdfcsky.com/news/stock-markets-rebound-amid-easing-crude-oil-prices-sensex-up-299-points','title':'HDFC Sky: Tata Steel among top gainers in Sep 24 rebound'}
            ],
            'claims':[
              {'claim_id':'C1','evidence_category':'BUSINESS_FUNDAMENTALS','verification_status':'VERIFIED','materiality':'MODERATE','direction':'POSITIVE','independent_validation':True,'source_ids':['S1','S2'],'claim':'Tata Steel entered FY27 with supportive India steel growth and FY26 production/capacity momentum. Public financial data remain fundamentally positive on a year-on-year basis, though quarter-to-quarter softness prevents an unqualified bullish score.'},
              {'claim_id':'C2','evidence_category':'VALUATION','verification_status':'VERIFIED','materiality':'LOW','direction':'NEUTRAL','independent_validation':True,'source_ids':['S1'],'claim':'Current public valuation metrics are verifiable but do not establish a sufficiently robust peer-normalized discount or premium for a directional valuation call, so valuation remains neutral.'},
              {'claim_id':'C3','evidence_category':'INSTITUTIONAL_BEHAVIOUR','verification_status':'VERIFIED','materiality':'MODERATE','direction':'NEUTRAL','independent_validation':True,'source_ids':['S1'],'claim':'The latest cited ownership snapshot remains mixed, with higher FII ownership offset by declines in other holder categories; institutional direction is therefore neutral rather than one-sided.'},
              {'claim_id':'C4','evidence_category':'NEWS_EVENTS_CATALYSTS','verification_status':'VERIFIED','materiality':'MODERATE','direction':'POSITIVE','independent_validation':True,'source_ids':['S2','S6'],'claim':'India steel growth remains supportive and Tata Steel was among the stronger names in the Sep 24 market rebound. This is a positive cyclical and near-term sentiment catalyst, tempered by broader macro volatility.'},
              {'claim_id':'C5','evidence_category':'EVENT_SHOCK','verification_status':'VERIFIED','materiality':'MODERATE','direction':'NEUTRAL','independent_validation':True,'source_ids':['S3','S4','S5'],'claim':'Today includes a scheduled Tata Steel Hong Kong investor meeting, while EU steel safeguards and ongoing Tata Group governance uncertainty add event sensitivity. No independently verified binary Tata Steel operating shock was found, so event-shock direction remains neutral with non-zero risk.'}
            ]
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          digest=hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
            with conn.cursor() as cur:
              cur.execute('''
                INSERT INTO edge_research_bundles(
                  bundle_id,ticker,contract_version,research_authority,research_fresh_at,created_at,payload,payload_hash,status
                ) VALUES (%s,'TATASTEEL','EDGE_RESEARCH_BUNDLE_V1','CHATGPT',%s,%s,%s::jsonb,%s,'READY')
                ON CONFLICT (bundle_id) DO NOTHING
              ''',(bundle_id,fresh,fresh,canonical,digest))
              cur.execute('SELECT bundle_id,ticker,status,research_fresh_at FROM edge_research_bundles WHERE bundle_id=%s',(bundle_id,))
              row=cur.fetchone()
              if not row: raise SystemExit('RESEARCH_BUNDLE_INSERT_FAILED')
              print(json.dumps({'bundle_id':row[0],'ticker':row[1],'status':row[2],'research_fresh_at':row[3].isoformat()},sort_keys=True))
            conn.commit()
          PY
      - name: Run governed production EDGE publisher
        run: |
          set -o pipefail
          python -m src.autonomous_publish_cli | tee edge-tatasteel-publish.json
      - name: Upload EDGE output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-tatasteel-20260925-1059
          path: |
            edge-tatasteel-publish.json
            edge-published-report.md
          if-no-files-found: ignore
          retention-days: 30
