name: EDGE Stock Data Snapshot

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE trading symbol"
        required: true
      lifecycle_id:
        description: "Immutable EDGE lifecycle id"
        required: true
      trigger_type:
        description: "USER or SCHEDULED"
        required: true
        default: "USER"
      target_session:
        description: "Optional target NSE session YYYY-MM-DD"
        required: false
      canonical_requested_at:
        description: "Optional governed pre-open request timestamp"
        required: false

permissions:
  contents: read

concurrency:
  group: edge-stock-data-${{ inputs.lifecycle_id }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      EDGE_TICKER: ${{ inputs.ticker }}
      EDGE_LIFECYCLE_ID: ${{ inputs.lifecycle_id }}
      EDGE_TRIGGER_TYPE: ${{ inputs.trigger_type }}
      EDGE_TARGET_SESSION: ${{ inputs.target_session }}
      EDGE_CANONICAL_REQUESTED_AT: ${{ inputs.canonical_requested_at }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Acquire and persist immutable DATA snapshot
        run: |
          set -o pipefail
          python -m src.market_snapshot_cli | tee edge-stock-data-snapshot.json
      - name: Upload bounded DATA-stage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-stock-data-${{ inputs.lifecycle_id }}
          path: edge-stock-data-snapshot.json
          retention-days: 14
          if-no-files-found: error
